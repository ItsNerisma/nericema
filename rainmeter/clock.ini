[Rainmeter]
Update=1000
AccurateText=1
DynamicVariables=1
DynamicWindowSize=1

[Metadata]
Name=Custom Clock
Author=Nerisma
Version=1.4

[Variables]
FontName=Silver Charm Duo
FontWeight=900

DateFontSize=312
MonthFontSize=156
TimeFontSize=54

Width=600
Height=600

;SolidColor=136, 136, 185
;Transparent=119,119,255,0

MainColor=240, 151, 151

Gradient=GradientColor | -90 | #MainColor#,255 ; 0.5 | #MainColor#,64 ; 1.0

; ============
; Measures
; ============

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%d
FormatLocale=fr-FR

[MeasureMonth]
Measure=Time
Format=%B
FormatLocale=fr-FR

; ============
; Meters
; ============

[MeterDate]
Meter=String
MeasureName=MeasureDate
StringCase=upper

FontFace=Hotel De Paris
FontSize=#DateFontSize#
FontColor=#MainColor#
FontWeight=900
AntiAlias=1

InlineSetting=#Gradient#

X=(#Width#/2)
Y=0
StringAlign=Center
RegExpSubstitute=1

[MeterMonth]
Meter=String
MeasureName=MeasureMonth
StringCase=upper

FontFace=#FontName#
FontSize=#MonthFontSize#
FontColor=255,255,255,255
FontWeight=100
AntiAlias=1

X=(#Width#/2)
Y=(#DateFontSize#/2)+20
StringAlign=Center

[MeterTime]
Meter=String
MeasureName=MeasureTime

FontFace=#FontName#
FontSize=#TimeFontSize#
FontColor=255,255,255,255
FontWeight=400
AntiAlias=1

X=(#Width#/2)
Y=-40R
StringAlign=Center